<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX - Central de Gestão Acadêmica</title>
    <link rel="stylesheet" href="css/academic_portal.css">
</head>
<body>
    <!-- Ambient Blur Backgrounds -->
    <div class="ambient-blurs">
        <div class="blur-orb orb-1"></div>
        <div class="blur-orb orb-2"></div>
        <div class="blur-orb orb-3"></div>
    </div>

    <div class="academic-frame">
        <!-- Sidebar Role Selector -->
        <aside class="academic-sidebar">
            <div class="sidebar-branding" onclick="location.href = OnyxCore.Session.getHomeURL();" title="Voltar à Home">
                <div class="academic-logo-icon">🏫</div>
                <div>
                    <h3>ONYX ECO</h3>
                    <span class="u-text-accent u-font-07">GESTÃO PEDAGÓGICA</span>
                </div>
            </div>

            <!-- Tab Buttons -->
            <nav class="role-menu-list">
                <button class="role-menu-item active" data-tab="tab-direcao">
                    <span class="nav-icon-lg">📊</span>
                    Direção (AI Preditiva)
                </button>
                <button class="role-menu-item" data-tab="tab-corpo-docente">
                    <span class="nav-icon-lg">👩‍🏫</span>
                    Corpo Docente
                </button>
                <button class="role-menu-item" data-tab="tab-secretaria">
                    <span class="nav-icon-lg">🎒</span>
                    Secretaria & Diário
                </button>
                <button class="role-menu-item" data-tab="tab-responsaveis">
                    <span class="nav-icon-lg">👪</span>
                    Portal de Pais
                </button>
                <button class="role-menu-item" data-tab="tab-online-surveillance">
                    <span class="nav-icon-lg">📡</span>
                    Operadores Online
                </button>
            </nav>

            <!-- Navigation Back -->
            <div class="back-btn-container">
                <button onclick="location.href = OnyxCore.Session.getHomeURL();" class="btn-back-core">
                    🏠 VOLTAR À HOME
                </button>
            </div>
        </aside>

        <!-- Main Operational Deck -->
        <main class="academic-viewport">
            <!-- Header Block -->
            <header class="academic-header-deck">
                <div>
                    <h1 class="u-font-header">CENTRAL DE GESTÃO ACADÊMICA</h1>
                    <p class="u-text-muted u-font-08">Administração e análise estratégica integradas do Novo Ensino Médio.</p>
                </div>
                <div class="portal-header-actions">
                    <div class="portal-header-meta">
                        <div class="u-font-07 u-text-muted meta-label">PERFIL DO OPERADOR</div>
                        <span id="logged-user-name" class="meta-user">...</span>
                    </div>
                    <div class="academic-badge">
                        ONYX-ACADEMIC-CORE v4.8
                    </div>
                </div>
            </header>

            <!-- Workspace Card -->
            <section id="workspace-card" class="academic-workspace-card">
                <!-- Content injected dynamically via JavaScript -->
            </section>
        </main>
    </div>

    <!-- Script imports -->
    <script src="js/onyx_core.js"></script>
    <script src="js/onyx_network.js"></script>
    <script src="js/onyx_cognitive.js"></script>
    <script src="js/onyx_db_manager.js"></script>
    <script src="js/onyx_database.js"></script>
    <script src="js/onyx_engines.js"></script>
    <script src="js/onyx_ui.js"></script>
    <script src="js/extremo.js"></script>

    <script>
        let userStats = null;
        let activeTab = 'tab-direcao';

        // Check authentication and initialize
        async function init() {
            const userName = await OnyxCore.Session.checkAuth();
            if (!userName) return;
            
            if (window.OnyxDBManager) {
                await window.OnyxDBManager.init();
            } else {
                await OnyxCore.DB.init();
            }
            userStats = await OnyxCore.DB.getUser(userName);
            if (!userStats) userStats = { id: userName, level: 1, xp: 0 };

            const userRole = userStats.role || 'aluno';
            if (userRole !== 'gestor') {
                alert("🚨 ACESSO RESTRITO A GESTORES\n\nEste terminal administrativo é reservado exclusivamente a diretores, professores e funcionários credenciados.");
                location.href = 'dashboard.html';
                return;
            }

            // Sincronizar Motor de Rede em Tempo Real no modo Gestor
            if (typeof OnyxNetwork !== 'undefined') {
                await OnyxNetwork.init(userStats.id, userStats.level, '💼');
                OnyxNetwork.onOperatorsUpdated = () => {
                    if (activeTab === 'tab-online-surveillance') {
                        renderWorkspace();
                    }
                };
            }

            const loggedUserEl = document.getElementById('logged-user-name');
            loggedUserEl.textContent = userStats.id.toUpperCase() + " ";
            const roleSpan = document.createElement('span');
            roleSpan.style.color = "var(--accent)";
            roleSpan.style.fontSize = "0.7rem";
            roleSpan.style.fontWeight = "800";
            roleSpan.style.fontFamily = "var(--font-mono)";
            roleSpan.textContent = "[GESTOR]";
            loggedUserEl.appendChild(roleSpan);

            // Set up sidebar tabs
            document.querySelectorAll('.role-menu-item').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.role-menu-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');
                    activeTab = btn.dataset.tab;
                    renderWorkspace();
                };
            });

            // Default student list in localStorage if not exists
            if (!localStorage.getItem('onyx_school_students')) {
                const defaultStudents = [
                    { id: 1, name: "Ana Souza", grade: 8.5, freq: 88, status: "Aprovada" },
                    { id: 2, name: "Rodrigo Silva", grade: 6.2, freq: 72, status: "Atenção" },
                    { id: 3, name: "Guilherme Santos", grade: 9.1, freq: 95, status: "Destaque" }
                ];
                localStorage.setItem('onyx_school_students', JSON.stringify(defaultStudents));
            }

            // Default teacher list in localStorage if not exists
            if (!localStorage.getItem('onyx_school_teachers')) {
                const defaultTeachers = [
                    { id: 1, name: "Prof. Marcos Aurelio", subject: "Matemática e suas Tecnologias", status: "Ativo" },
                    { id: 2, name: "Profa. Julia Mendes", subject: "Ciências da Natureza", status: "Ativo" },
                    { id: 3, name: "Prof. Carlos Silveira", subject: "Linguagens e Códigos", status: "Ativo" }
                ];
                localStorage.setItem('onyx_school_teachers', JSON.stringify(defaultTeachers));
            }
            renderWorkspace();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        let currentSecretariaFilter = 'ALL';

        window.setSecretariaFilter = function(filterVal) {
            currentSecretariaFilter = filterVal;
            document.querySelectorAll('.btn-filter-selector').forEach(btn => btn.classList.remove('active'));
            if (filterVal === 'ALL') document.getElementById('filter-all').classList.add('active');
            else if (filterVal === 'DESTAQUE') document.getElementById('filter-destaque').classList.add('active');
            else if (filterVal === 'REGULAR') document.getElementById('filter-regular').classList.add('active');
            else if (filterVal === 'ATENCAO') document.getElementById('filter-atencao').classList.add('active');
            renderSecretariaLists();
        };

        async function renderWorkspace() {
            const container = document.getElementById('workspace-card');
            if (!container) return;
            
            if (activeTab === 'tab-direcao') {
                const students = getStudents();
                const studentOptions = students.map(s => `<option value="${s.id}">${escapeHTML(s.name)} (Média: ${s.grade.toFixed(1)} | Presença: ${s.freq}%)</option>`).join('');

                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:25px;">
                        <div>
                            <h2 style="margin:0 0 5px 0; font-family:var(--font-header); color:#fff; font-size:1.3rem;">📊 DIRETORIA COGNITIVA (IA PREDITIVA DE 1º MUNDO)</h2>
                            <p style="margin:0;" class="u-text-muted u-font-08">Análise preditiva heurística de desempenho, evasão e engajamento escolar em tempo real.</p>
                        </div>

                        <!-- Student Selector for AI prediction -->
                        <div class="metric-glass-card" style="padding: 15px 20px; display:flex; flex-direction:column; gap:8px;">
                            <label class="u-font-07 u-text-muted" style="font-weight:800; font-family:var(--font-mono);">📊 SELECIONE UM ESTUDANTE PARA ESTRATÉGIA E DIAGNÓSTICO DE IA PREDITIVA:</label>
                            <select id="diretoria-student-selector" class="academic-input u-w-full" onchange="loadStudentAIInsight()" style="background:rgba(0,0,0,0.5); padding:10px; border:1px solid var(--glass-border); color:#fff; cursor:pointer;">
                                ${studentOptions}
                            </select>
                        </div>

                        <!-- Container filled dynamically by loadStudentAIInsight() -->
                        <div id="diretoria-insights-container" style="display:flex; flex-direction:column; gap:25px;">
                            <div class="u-text-center u-p-20"><p class="u-text-muted u-font-08">CARREGANDO MAPA COGNITIVO E REDES NEURAIS...</p></div>
                        </div>
                    </div>
                `;

                loadStudentAIInsight();
            } 
            
            else if (activeTab === 'tab-corpo-docente') {
                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:20px;">
                        <div>
                            <h2 style="margin:0 0 5px 0; font-family:var(--font-header); color:#fff; font-size:1.3rem;">👩‍🏫 GESTÃO DO CORPO DOCENTE E CONTROLE DE PROFICIÊNCIA</h2>

                                <div class="metric-glass-card">
                                    <h3 style="margin:0 0 10px 0; font-family:var(--font-header); color:#fff; font-size:0.9rem;">🚫 MAPA COGNITIVO DE MATÉRIAS TRAVADAS</h3>
                                    <p class="u-font-07 u-text-muted u-mb-15">Tópicos com índice de reprovação do aluno acumulado acima de 40% nas tentativas:</p>
                                    <div style="display:flex; flex-direction:column; gap:8px;">
                                        <div class="u-flex-between u-p-10" style="background:rgba(239,68,68,0.05); border:1px solid rgba(239,68,68,0.15); border-radius:8px; font-size:0.75rem;">
                                            <span class="u-weight-800" style="color:var(--error);">📐 Geometria Espacial (Matemática)</span>

                                            <select id="prof-add-subject" class="academic-input" style="background:rgba(0,0,0,0.5); padding:10px; border:1px solid var(--glass-border); color:#fff; cursor:pointer; font-size:0.8rem;">
                                                <option value="Matemática e suas Tecnologias">📐 MATEMÁTICA E SUAS TECNOLOGIAS</option>
                                                <option value="Ciências da Natureza">🧬 CIÊNCIAS DA NATUREZA</option>
                                                <option value="Linguagens e Códigos">📚 LINGUAGENS E CÓDIGOS</option>
                                                <option value="Ciências Humanas e Sociais">🌍 CIÊNCIAS HUMANAS E SOCIAIS</option>
                                                <option value="Itinerários e Tecnologia">🚀 ITINERÁRIOS E TECNOLOGIA</option>
                                            </select>
                                        </div>
                                        <button onclick="matriculateTeacher()" class="btn-academic-primary" style="justify-content:center; margin-top:10px;">
                                            ➕ REGISTRAR PROFESSOR NO NÚCLEO
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column: Classroom Grading list + Registered Teachers list -->
                            <div style="display:flex; flex-direction:column; gap:20px;">
                                <div class="metric-glass-card">
                                    <div class="u-flex-between u-mb-10">
                                        <h3 style="margin:0; font-family:var(--font-header); color:#fff; font-size:0.9rem;">📝 LANÇAMENTO DE NOTAS / AJUSTE PEDAGÓGICO</h3>
                                        <span class="u-font-07 u-text-accent" id="overall-school-average" style="font-weight:800; font-family:var(--font-mono);">Média Geral: ...</span>
                                    </div>
                                    <p class="u-font-07 u-text-muted u-mb-15">Simule ajustes de nota pedagógicos com bonificação automática de XP no perfil do aluno:</p>
                                    <div id="prof-students-grading-list" style="display:flex; flex-direction:column; gap:10px;"></div>
                                </div>

                                <div class="metric-glass-card">
                                    <h3 style="margin:0 0 10px 0; font-family:var(--font-header); color:#fff; font-size:0.9rem;">👥 DIREÇÃO E DISPONIBILIDADE DO CORPO DOCENTE</h3>
                                    <p class="u-font-07 u-text-muted u-mb-15">Docentes ativos no ecossistema e status de disponibilidade real no Ensino Médio:</p>
                                    <div id="prof-teachers-list" class="teacher-grid-list"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                renderTeacherStudentList();
                renderTeachersList();
                updateOverallAverageLabel();
            } 
            
            else if (activeTab === 'tab-secretaria') {
                container.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:20px;">
                        <div>
                            <h2 style="margin:0 0 5px 0; font-family:var(--font-header); color:#fff; font-size:1.3rem;">🎒 SECRETARIA & DIÁRIO ELETRÔNICO (CRUD & CHAMADA)</h2>
                            <p style="margin:0;" class="u-text-muted u-font-08">Cadastre novos alunos (CRUD), filtre por competências e registre presenças dinâmicas no diário eletrônico.</p>

                        <div class="u-grid-2" style="gap:20px; border-top:1px solid var(--glass-border); padding-top:20px;">

                            <div style="display:flex; flex-direction:column; gap:20px;">
                                <div class="metric-glass-card">
                                    <h3 style="margin:0 0 10px 0; font-family:var(--font-header); color:#fff; font-size:0.9rem;">📝 MATRICULAR NOVO ESTUDANTE (CRUD)</h3>
                                    <div style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">
                                        <div style="display:flex; flex-direction:column; gap:5px;">
                                            <label class="u-font-07 u-text-muted" style="font-weight:800;">NOME COMPLETO DO ALUNO</label>
                                            <input type="text" id="sec-add-name" placeholder="Ex: Felipe Ferreira" class="academic-input" autocomplete="off">
                                        </div>
                                        <div style="display:flex; flex-direction:column; gap:5px;">
                                            <label class="u-font-07 u-text-muted" style="font-weight:800;">MÉDIA INICIAL</label>
                                            <input type="number" id="sec-add-grade" placeholder="7.5" step="0.1" min="0" max="10" class="academic-input">
                                        </div>
                                        <button onclick="matriculateStudent()" class="btn-academic-primary" style="justify-content:center; margin-top:10px;">
                                            ➕ REGISTRAR MATRÍCULA NO SISTEMA
                                        </button>
                                    </div>
                                </div>

                                <div class="metric-glass-card">
                                    <h3 style="margin:0 0 12px 0; font-family:var(--font-header); color:#fff; font-size:0.9rem;">🔎 BUSCA E FILTROS DE COMPETÊNCIAS</h3>
                                    <input type="text" id="sec-search-input" oninput="renderSecretariaLists()" placeholder="🔍 Digite para buscar estudante..." class="academic-input u-w-full u-mb-15" autocomplete="off">
                                    
                                    <div class="filter-controls-bar">
                                        <button class="btn-filter-selector active" id="filter-all" onclick="setSecretariaFilter('ALL')">TODOS</button>
                                        <button class="btn-filter-selector" id="filter-destaque" onclick="setSecretariaFilter('DESTAQUE')">🌟 DESTAQUES (>=9.0)</button>
                                        <button class="btn-filter-selector" id="filter-regular" onclick="setSecretariaFilter('REGULAR')">👍 REGULARES (7.0-8.9)</button>
                                        <button class="btn-filter-selector" id="filter-atencao" onclick="setSecretariaFilter('ATENCAO')">🚨 ATENÇÃO (<7.0)</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Attendance sheet -->
                            <div class="metric-glass-card">
                                <h3 style="margin:0 0 10px 0; font-family:var(--font-header); color:#fff; font-size:0.9rem;">📋 DIÁRIO DE CLASSE / CHAMADA ATIVA & CREDENCIAIS</h3>
                                <p class="u-font-07 u-text-muted u-mb-15">Gerencie faltas, presenças e baixe transcrições oficiais seguras com validadores digitais:</p>

                renderSecretariaLists();
            } 
            
            else if (activeTab === 'tab-responsaveis') {
                container.innerHTML = `

                            <div class="metric-glass-card" style="display:flex; flex-direction:column; gap:15px;">
                                <div>

                                <div style="display:flex; gap:10px;">

                            <!-- Parents Direct messages -->

                                <p class="u-font-07 u-text-muted u-mb-10">Selecione uma ação rápida ou envie mensagens customizadas de orientação:</p>

                const botOps = [
                    { name: 'Onyx_Master', level: 30, avatar: '🇧🇷 💎', publicIp: '186.221.4.15', isLAN: false, status: 'searching', region: 'REDE REMOTA (WAN)', ping: 42 },
                    { name: 'Data_Slayer', level: 25, avatar: '🇧🇷 ⚔️', publicIp: '200.142.19.8', isLAN: false, status: 'in-battle', region: 'REDE REMOTA (WAN)', ping: 68 },
                    { name: 'Code_Reaper', level: 22, avatar: '🇧🇷 💀', publicIp: '177.89.54.120', isLAN: false, status: 'searching', region: 'REDE REMOTA (WAN)', ping: 55 },

        function getStudents() {
            return JSON.parse(localStorage.getItem('onyx_school_students') || '[]');

        function saveStudents(arr) {
            localStorage.setItem('onyx_school_students', JSON.stringify(arr));
        }

        function getTeachers() {
            return JSON.parse(localStorage.getItem('onyx_school_teachers') || '[]');
        }

        function saveTeachers(arr) {
            localStorage.setItem('onyx_school_teachers', JSON.stringify(arr));
        }

        window.updateTeacherStatus = function(id, newStatus) {
            const teachers = getTeachers();
            const teacher = teachers.find(t => t.id === id);
            if (teacher) {
                teacher.status = newStatus;
                saveTeachers(teachers);
                renderTeachersList();

                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('success');
                    OnyxUI.addReasoningLog(`GRADES: Alterou disponibilidade de ${teacher.name} para ${newStatus}.`);
                }
            }
        };

        function renderTeachersList() {
            const list = document.getElementById('prof-teachers-list');
            if (!list) return;

            const teachers = getTeachers();
            if (teachers.length === 0) {
                list.innerHTML = `<p class="u-text-muted u-font-07 u-text-center" style="margin:10px 0; font-style:italic;">Nenhum docente cadastrado no momento.</p>`;
                return;
            }

            const students = getStudents();
            const studentCount = students.length;

            list.innerHTML = teachers.map(tc => {
                const classAverage = studentCount > 0 
                    ? (students.reduce((acc, s) => acc + s.grade, 0) / studentCount) 
                    : 7.0;

                const activeStatus = tc.status || 'Ativo';
                let indicatorColor = "#10b981"; // Emerald
                if (activeStatus === 'Em Reunião') indicatorColor = "#f59e0b"; // Warning
                else if (activeStatus === 'Em Licença') indicatorColor = "#ef4444"; // Error

                const statusOptions = ['Ativo', 'Em Reunião', 'Em Licença'].map(st => 
                    `<option value="${st}" ${activeStatus === st ? 'selected' : ''}>${st.toUpperCase()}</option>`
                ).join('');

                return `
                    <div class="teacher-card" style="animation: contentReveal 0.2s forwards;">
                        <div class="u-flex-between">
                            <div>
                                <strong style="color:#fff; font-size:0.85rem;">${escapeHTML(tc.name)}</strong>
                                <span class="u-font-06" style="color:var(--accent); font-weight:800; font-family:var(--font-mono); display:block; margin-top:2px;">
                                    ${escapeHTML(tc.subject.toUpperCase())}
                                </span>
                            </div>
                            <button onclick="removeTeacher(${tc.id})" class="btn-academic-outline" style="color:var(--error); border-color:rgba(239,68,68,0.2); padding:3px 6px; font-size:0.6rem; font-family:var(--font-mono); cursor:pointer;">🗑️ REMOVER</button>

        window.removeTeacher = function(id) {
            let teachers = getTeachers();
            const teacher = teachers.find(t => t.id === id);
            if (teacher) {
                teachers = teachers.filter(t => t.id !== id);
                saveTeachers(teachers);
                renderTeachersList();
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('alert');
                    OnyxUI.addReasoningLog(`GRADES: Gestor removeu docente ${teacher.name} do ecossistema.`);
                }
            }
        };

        window.matriculateTeacher = function() {
            const nameInput = document.getElementById('prof-add-name');
            const subjectSelect = document.getElementById('prof-add-subject');
            if (!nameInput || !subjectSelect) return;
            const name = nameInput.value.trim();
            const subject = subjectSelect.value;

            if (!name) {
                alert("🔴 O nome do docente é obrigatório.");
                return;
            }

            const teachers = getTeachers();
            const newId = teachers.length > 0 ? Math.max(...teachers.map(t => t.id)) + 1 : 1;
            const newTeacher = { id: newId, name: name, subject: subject, status: "Ativo" };
            teachers.push(newTeacher);
            saveTeachers(teachers);

            nameInput.value = '';
            renderTeachersList();

            if (typeof OnyxUI !== 'undefined') {
                OnyxUI.playFeedback('success');
                OnyxUI.addReasoningLog(`GRADES: Novo docente ${name} matriculado no departamento de ${subject}.`);
            }

            // Reward Operator with +25 XP
            if (userStats) {
                userStats.xp += 25;
                OnyxCore.DB.saveUser(userStats);
            }

            alert(`✅ Docente ${name} cadastrado com sucesso na matriz de ${subject}! (+25 XP Administrador)`);
        };

        // --- Direção Tab AI Preditiva Controller ---
        window.simulateIntervention = function(id, type) {
            const students = getStudents();
            const student = students.find(s => s.id === id);
            if (!student) return;

            if (type === 'evasao') {
                student.freq = Math.min(100, student.freq + 8);
                saveStudents(students);
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('success');
                    OnyxUI.addReasoningLog(`AI INTERVENTION: Apoio emergencial acionado para ${student.name}. Assiduidade simulada subiu para ${student.freq}%.`);
                }
                alert(`🚨 Apoio emergencial disparado para os pais de ${student.name}! Assiduidade e acompanhamento pedagógico elevados com sucesso!`);
            } else if (type === 'recuperacao') {
                student.grade = Math.min(10.0, student.grade + 1.2);
                saveStudents(students);
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('success');
                    OnyxUI.addReasoningLog(`AI INTERVENTION: Trilha adaptativa aplicada em matérias travadas de ${student.name}. Média ajustada para ${student.grade.toFixed(1)}`);
                }
                alert(`📚 Trilha adaptativa de reforço aplicada! A média de ${student.name} subiu para ${student.grade.toFixed(1)}!`);
            } else if (type === 'aceleracao') {
                if (userStats) {
                    userStats.xp += 50;
                    OnyxCore.DB.saveUser(userStats);
                }
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('level-up');
                    OnyxUI.addReasoningLog(`AI INTERVENTION: ${student.name} incluído na Olimpíada Nacional de Ciências (+50 XP Gestor).`);
                }
                alert(`🚀 Curriculo acelerado com sucesso! ${student.name} adicionado ao time olímpico da ONC. (+50 XP Gestor de Elite)`);
            }
            loadStudentAIInsight();
        };

                        <!-- BNCC Competencies averages -->
                        <div class="metric-glass-card" style="margin-top:10px; animation: contentReveal 0.3s forwards;">
                            <h3 style="margin:0 0 15px 0; font-family:var(--font-header); color:#fff; font-size:1rem;">🎯 MAPA DE PROFICIÊNCIA BNCC (1º MUNDO)</h3>
                            <div class="u-grid-2" style="gap:20px;">
                                <div>
                                    <div style="display:flex; flex-direction:column; gap:12px;">
                                        <div>
                                            <div class="u-flex-between u-mb-5 u-font-07">
                                                <span>📚 LINGUAGENS E SUAS TECNOLOGIAS</span>
                                                <span class="u-text-accent u-weight-800">${compLinguagens}%</span>
                                            </div>
                                            <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${compLinguagens}%; background:var(--accent);"></div></div>
                                        </div>
                                        <div>
                                            <div class="u-flex-between u-mb-5 u-font-07">
                                                <span>📐 MATEMÁTICA E SUAS TECNOLOGIAS</span>
                                                <span class="u-text-primary u-weight-800">${compMatematica}%</span>
                                            </div>
                                            <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${compMatematica}%; background:var(--primary);"></div></div>
                                        </div>
                                        <div>
                                            <div class="u-flex-between u-mb-5 u-font-07">
                                                <span>🧬 CIÊNCIAS DA NATUREZA</span>
                                                <span class="u-text-warning u-weight-800">${compNatureza}%</span>
                                            </div>
                                            <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${compNatureza}%; background:var(--warning);"></div></div>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <div style="display:flex; flex-direction:column; gap:12px;">
                                        <div>
                                            <div class="u-flex-between u-mb-5 u-font-07">
                                                <span>🌍 HUMANAS E SOCIAIS APLICADAS</span>
                                                <span style="color:#a855f7; font-weight:800;">${compHumanas}%</span>
                                            </div>
                                            <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${compHumanas}%; background:#a855f7;"></div></div>
                                        </div>
                                        <div>
                                            <div class="u-flex-between u-mb-5 u-font-07">
                                                <span>🚀 ITINERÁRIOS PROFISSIONAIS</span>
                                                <span class="u-text-accent u-weight-800">${compItinerarios}%</span>
                                            </div>
                                            <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${compItinerarios}%; background:var(--accent);"></div></div>
                                        </div>
                                        <div>
                                            <div class="u-flex-between u-mb-5 u-font-07">
                                                <span>✨ EXTENSÕES E LABORATÓRIOS</span>
                                                <span class="u-text-primary u-weight-800">${compExtras}%</span>
                                            </div>
                                            <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${compExtras}%; background:var(--primary);"></div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Recommendations alert & Actions -->
                        <div class="u-grid-2" style="gap:15px; align-items: stretch;">
                            <div style="background:rgba(255,255,255,0.01); border:1px solid var(--glass-border); border-radius:12px; padding:15px; font-size:0.78rem; line-height:1.5; display:flex; flex-direction:column; justify-content:center;">
                                <strong>📢 RECOMENDAÇÃO HEURÍSTICA DA DIREÇÃO:</strong>
                                <p style="margin:8px 0 0 0; color:#e2e8f0;">${recommendation}</p>
                            </div>
                            
                            <div style="display:flex; flex-direction:column; justify-content:center; gap:10px;">
                                ${actionsHTML}
                            </div>
                        </div>
                    `;
                }
            }, 600);
        };

        // --- Teacher Tab Grading ---
        window.updateOverallAverageLabel = function() {
            const students = getStudents();
            const label = document.getElementById('overall-school-average');
            if (label && students.length > 0) {
                const avg = students.reduce((acc, s) => acc + s.grade, 0) / students.length;
                label.textContent = `Média Geral: ${avg.toFixed(2)} / 10`;
            }
        };

        function renderTeacherStudentList() {
            const list = document.getElementById('prof-students-grading-list');
            if (!list) return;

            const students = getStudents();
            list.innerHTML = students.map(st => `
                <div class="u-flex-between u-p-10" style="background:rgba(255,255,255,0.02); border:1px solid var(--glass-border); border-radius:10px; font-size:0.8rem; animation: contentReveal 0.2s forwards; margin-bottom:6px;">
                    <div>
                        <strong style="color:#fff;">${escapeHTML(st.name)}</strong>
                        <div class="u-font-06 u-text-muted">MÉDIA ATUAL: <span class="u-text-accent" id="prof-grade-${st.id}">${st.grade.toFixed(1)}</span> / 10</div>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button onclick="adjustGrade(${st.id}, 0.5)" class="btn-academic-outline" style="color:var(--accent); border-color:rgba(16,185,129,0.3); font-weight:800;">+0.5</button>
                        <button onclick="adjustGrade(${st.id}, -0.5)" class="btn-academic-outline" style="color:var(--error); border-color:rgba(239,68,68,0.3); font-weight:800;">-0.5</button>
                    </div>
                </div>
            `).join('');
        }

        window.adjustGrade = function(id, delta) {
            const students = getStudents();
            const student = students.find(s => s.id === id);
            if (student) {
                student.grade = Math.max(0, Math.min(10, student.grade + delta));
                saveStudents(students);
                
                const gradeSpan = document.getElementById(`prof-grade-${id}`);
                if (gradeSpan) gradeSpan.textContent = student.grade.toFixed(1);

                updateOverallAverageLabel();
                renderTeachersList();

                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('success');
                    OnyxUI.addReasoningLog(`GRADES: Professor ajustou nota de ${student.name} em ${delta > 0 ? '+' : ''}${delta}. Nova nota: ${student.grade.toFixed(1)}`);
                }

                if (userStats) {
                    userStats.xp += 15;
                    OnyxCore.DB.saveUser(userStats);
                }
            }
        };

        // --- Secretaria Tab CRUD & Attendance ---
        window.renderSecretariaLists = function() {
            const list = document.getElementById('sec-attendance-list');
            if (!list) return;

            const students = getStudents();
            if (students.length === 0) {
                list.innerHTML = `<p class="u-text-muted u-font-07 u-text-center" style="margin:20px 0; font-style:italic;">Nenhum estudante matriculado.</p>`;
                return;
            }

            const searchInput = document.getElementById('sec-search-input');
            const searchKeyword = searchInput ? searchInput.value.toLowerCase().trim() : '';

            let filtered = students;
            if (currentSecretariaFilter === 'DESTAQUE') {
                filtered = students.filter(s => s.grade >= 9.0);
            } else if (currentSecretariaFilter === 'REGULAR') {
                filtered = students.filter(s => s.grade >= 7.0 && s.grade < 9.0);
            } else if (currentSecretariaFilter === 'ATENCAO') {
                filtered = students.filter(s => s.grade < 7.0 || s.freq < 75);
            }

            if (searchKeyword !== '') {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(searchKeyword));
            }

            if (filtered.length === 0) {
                list.innerHTML = `<p class="u-text-muted u-font-07 u-text-center" style="margin:20px 0; font-style:italic;">Nenhum estudante localizado nos filtros.</p>`;
                return;
            }

            list.innerHTML = filtered.map(st => {
                let badgeClass = "badge-aprovado";
                let badgeLabel = "Regular";
                if (st.grade >= 9.0) {
                    badgeClass = "badge-destaque";
                    badgeLabel = "Destaque 🌟";
                } else if (st.grade < 7.0) {
                    badgeClass = "badge-atencao";
                    badgeLabel = "Atenção ⚠️";
                } else if (st.freq < 75) {
                    badgeClass = "badge-evasao";
                    badgeLabel = "Evasão 🚨";
                }

                return `
                    <div class="u-flex-between u-mb-10 u-p-10" style="background:rgba(255,255,255,0.01); border:1px solid var(--glass-border); border-radius:10px; font-size:0.75rem; animation: contentReveal 0.2s forwards;">
                        <div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <strong style="color:#fff;">${escapeHTML(st.name)}</strong>
                                <span class="status-badge ${badgeClass}" style="padding:2px 6px; font-size:0.55rem;">${badgeLabel}</span>
                            </div>
                            <div class="u-font-06 u-text-muted u-mt-5">FREQUÊNCIA: <span id="sec-freq-${st.id}" style="color:${st.freq < 75 ? 'var(--error)' : 'var(--accent)'}; font-weight:800;">${st.freq}%</span> | NOTA: <span class="u-text-accent">${st.grade.toFixed(1)}</span></div>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <button onclick="giveAttendance(${st.id})" class="btn-academic-outline" style="background:rgba(16,185,129,0.05); border-color:rgba(16,185,129,0.2); color:#34d399; font-weight:800; font-size:0.6rem; cursor:pointer;" title="Registrar presença (+2%)">👍 PRESENÇA</button>
                            <button onclick="downloadTranscript(${st.id})" class="btn-academic-outline" style="background:rgba(14,165,233,0.05); border-color:rgba(14,165,233,0.2); color:#38bdf8; font-weight:800; font-size:0.6rem; cursor:pointer;" title="Emitir Credencial Oficial">📄 CREDENCIAL</button>
                            <button onclick="removeStudent(${st.id})" class="btn-academic-outline" style="background:rgba(239,68,68,0.05); border-color:rgba(239,68,68,0.2); color:#f87171; font-weight:800; font-size:0.6rem; cursor:pointer;">🗑️ DELETAR</button>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.removeStudent = function(id) {
            let students = getStudents();
            const student = students.find(s => s.id === id);
            if (student) {
                students = students.filter(s => s.id !== id);
                saveStudents(students);
                renderSecretariaLists();
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('alert');
                    OnyxUI.addReasoningLog(`SECRETARIA: Gestor removeu matrícula do estudante ${student.name}.`);
                }
            }
        };

        window.giveAttendance = function(id) {
            const students = getStudents();
            const student = students.find(s => s.id === id);
            if (student) {
                student.freq = Math.min(100, student.freq + 2);
                saveStudents(students);
                
                const freqSpan = document.getElementById(`sec-freq-${id}`);
                if (freqSpan) {
                    freqSpan.textContent = `${student.freq}%`;
                    freqSpan.style.color = student.freq < 75 ? 'var(--error)' : 'var(--accent)';
                }

                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('success');
                    OnyxUI.addReasoningLog(`PRESENÇA: Chamada ativa preenchida para ${student.name}. Frequência atual: ${student.freq}%`);
                }
            }
        };

        window.downloadTranscript = function(id) {
            const students = getStudents();
            const student = students.find(s => s.id === id);
            if (!student) return;

            const dateStr = new Date().toLocaleString('pt-BR');
            const signaturePayload = {
                issuer: "Onyx Academic Core v4.8",
                studentId: student.id,
                studentName: student.name,
                timestamp: Date.now(),
                salt: "OnyxSaltProtocolSecure1337!"
            };

            const hash = btoa(JSON.stringify(signaturePayload)).substring(0, 32);

            const transcriptContent = `================================================================
ONYX COGNITIVE ECOSYSTEM - CREDENCIAL ACADÊMICA DIGITAL
================================================================
EMISSÃO OFICIAL: ${dateStr}
CHANCELA DE SEGURANÇA: SEC-CRYPT-${hash.toUpperCase()}

DADOS DO ALUNO:
----------------------------------------------------------------
ID REGISTRO: ${student.id}
NOME: ${student.name.toUpperCase()}
MÉDIA ACUMULADA BNCC: ${student.grade.toFixed(2)} / 10.00
ASSIDUIDADE (FREQUÊNCIA): ${student.freq}%
STATUS PEDAGÓGICO: ${student.grade >= 9.0 ? 'EXCELÊNCIA (DESTAQUE)' : student.grade >= 7.0 ? 'REGULAR' : 'ATENÇÃO PEDAGÓGICA'}

CERTIFICAÇÃO DE ASSINATURA DIGITAL:
Este documento foi chancelado digitalmente pelo núcleo operativo
de segurança OnyxCore e está em conformidade com as diretrizes
técnicas do MEC e Novo Ensino Médio de Tecnologia.

[CÓDIGO DE VALIDAÇÃO QR-INTEGRITY: ${hash}]
================================================================`;

            const blob = new Blob([transcriptContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `onyx_credencial_${student.name.toLowerCase().replace(/\s+/g, '_')}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            if (typeof OnyxUI !== 'undefined') {
                OnyxUI.playFeedback('success');
                OnyxUI.addReasoningLog(`SECRETARIA: Exportou credencial digital de ${student.name}.`);
            }
            alert(`📄 Credencial oficial de ${student.name} gerada com assinatura de segurança! O arquivo .txt foi baixado.`);
        };

        window.matriculateStudent = function() {
            const nameInput = document.getElementById('sec-add-name');
            const gradeInput = document.getElementById('sec-add-grade');
            if (!nameInput || !gradeInput) return;
            
            const name = nameInput.value.trim();
            const grade = parseFloat(gradeInput.value) || 7.0;

            if (!name) {
                alert("🔴 O nome do estudante é obrigatório.");
                return;
            }

            const students = getStudents();
            const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
            
            const newStudent = { id: newId, name: name, grade: grade, freq: 100, status: "Matriculado" };
            students.push(newStudent);
            saveStudents(students);

            nameInput.value = '';
            gradeInput.value = '';

            renderSecretariaLists();

            if (typeof OnyxUI !== 'undefined') {
                OnyxUI.playFeedback('success');
                OnyxUI.addReasoningLog(`SECRETARIA: CRUD matrícula efetuada para ${name} (ID: ${newId}).`);
            }
            alert(`✅ Estudante ${name} matriculado com sucesso no diário!`);
        };

        // --- Responsáveis Tab Bulletin Checker ---
        window.searchBulletin = function() {
            const searchName = document.getElementById('resp-search-name').value.trim();
            const resultDiv = document.getElementById('resp-bulletin-result');
            if (!resultDiv) return;

            if (!searchName) {
                alert("Digite o nome de um aluno para buscar.");
                return;
            }

            const students = getStudents();
            const student = students.find(s => s.name.toLowerCase().includes(searchName.toLowerCase()));

            if (student) {
                resultDiv.style.display = 'block';
                
                let badgeClass = "badge-aprovado";
                let badgeLabel = "Regular";
                if (student.grade >= 9.0) {
                    badgeClass = "badge-destaque";
                    badgeLabel = "🌟 Excelência Pedagógica";
                } else if (student.grade < 7.0) {
                    badgeClass = "badge-atencao";
                    badgeLabel = "⚠️ Risco de Recuperação";
                } else if (student.freq < 75) {
                    badgeClass = "badge-evasao";
                    badgeLabel = "🚨 Risco Severo de Evasão";
                }

                const hashSignature = btoa(student.name + student.freq + student.grade).substring(0, 16).toUpperCase();

                resultDiv.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:12px; animation: contentReveal 0.3s forwards;">
                        <div class="u-flex-between">
                            <h4 style="margin:0; color:#fff; font-family:var(--font-header);">📋 BOLETIM PEDAGÓGICO DIGITAL</h4>
                            <span class="status-badge ${badgeClass}">${badgeLabel}</span>
                        </div>
                        
                        <div style="font-size:0.75rem; display:flex; flex-direction:column; gap:8px;">
                            <p style="margin:0;"><strong>Estudante:</strong> <span style="color:#fff; font-weight:800;">${escapeHTML(student.name)}</span></p>
                            
                            <div>
                                <div class="u-flex-between u-mb-5">
                                    <span>Média Acadêmica: <strong>${student.grade.toFixed(1)} / 10</strong></span>
                                </div>
                                <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${student.grade * 10}%; background:var(--accent);"></div></div>
                            </div>

                            <div>
                                <div class="u-flex-between u-mb-5">
                                    <span>Frequência Escolar: <strong>${student.freq}%</strong></span>
                                </div>
                                <div class="progress-bar-container"><div class="progress-bar-inner" style="width:${student.freq}%; background:var(--primary);"></div></div>
                            </div>
                        </div>

                        <!-- Verification Seal & QR -->
                        <div class="digital-seal-container u-mt-10">
                            <div class="qr-simulation"></div>
                            <div>
                                <strong style="font-size:0.65rem; color:#fff; display:block; font-family:var(--font-mono);">ONYX SECURE SEAL VERIFIED</strong>
                                <span style="font-size:0.55rem; color:var(--text-muted); font-family:var(--font-mono); display:block; margin-top:2px;">ASSINATURA: SEC-SIG-${hashSignature}</span>
                                <span style="font-size:0.55rem; color:var(--accent); font-weight:800; font-family:var(--font-mono); display:block;">INTEGRIDADE CHANCELADA DIGITALMENTE</span>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<p class="u-text-error u-font-07" style="margin:0;">Estudante não localizado no diário escolar.</p>`;
            }
        };

        // --- Parents direct chat message sender ---
        window.triggerQuickReply = function(msgText) {
            const input = document.getElementById('parent-chat-input');
            if (input) {
                input.value = msgText;
                sendParentMsg();
            }
        };

        window.sendParentMsg = function() {
            const input = document.getElementById('parent-chat-input');
            const board = document.getElementById('parent-chat-board');
            if (!input || !board) return;
            const msg = input.value.trim();

            if (!msg) return;
            input.value = '';

            board.innerHTML += `
                <div class="chat-msg-row sent">
                    <strong>Responsável:</strong> ${escapeHTML(msg)}
                </div>
            `;
            board.scrollTop = board.scrollHeight;

            if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');

            let replyText = "Recebemos sua mensagem. O tutor AI já registrou seu contato e as ações de monitoramento serão agendadas com a direção.";
            if (msg.toLowerCase().includes('reforço')) {
                replyText = "Tutor Pedagógico: Excelente solicitação. A trilha adaptativa de reforço focada já foi disponibilizada no diário do aluno. Aconselhamos acompanhar as missões de matemática.";
            } else if (msg.toLowerCase().includes('reunião')) {
                const randomHour = Math.floor(Math.random() * 4 + 14); // 14:00 to 17:00
                replyText = `Secretaria ONX: Agendamento prévio efetuado! Reunião pedagógica alocada com a coordenação para a próxima terça-feira às ${randomHour}:30. Confirmaremos os detalhes por e-mail.`;
            } else if (msg.toLowerCase().includes('falta') || msg.toLowerCase().includes('ausência')) {
                replyText = "Operador de Frequência: Justificativa devidamente anotada no diário da secretaria escolar. O atestado médico/justificativa física poderá ser carregado no portal.";
            }

            setTimeout(() => {
                board.innerHTML += `
                    <div class="chat-msg-row received">
                        <strong>Pedagógico:</strong> ${replyText}
                    </div>
                `;
                board.scrollTop = board.scrollHeight;
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('success');
            }, 1000);
        };
        window.onload = init;
    </script>
</body>
</html>
