<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX - Acesso ao Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
    <div class="bg-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="cyber-overlay">
        <div class="scanline"></div>
        <div class="noise"></div>
    </div>

    <main id="app">
        <section id="screen-login" class="screen active">
            <div class="card glass">
                <header>
                    <div class="logo">AVALIAÇÃO DE<span> TECNOLOGIA</span></div>
                    <h1>Acesso ao Sistema</h1>
                    <p>Entre com seu usuário e senha de operador</p>
                </header>

                <div class="auth-form-standalone">
                    <div id="login-status" class="u-status-msg"></div>
                    <div class="input-group">
                        <label for="login-name">USUÁRIO / NOME</label>
                        <input type="text" id="login-name" placeholder="Insira seu nome" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="login-pass">SENHA DE ACESSO</label>
                        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="off">
                    </div>
                    <div class="auth-form-actions">
                        <button id="btn-do-login" class="btn-primary">ENTRAR NO SISTEMA</button>
                        <button onclick="location.href='register.html'" class="btn-text">Não possui conta? Cadastre-se</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="system-status">
        <div class="status-item"><span class="status-dot"></span>ONYX_CORE: <span id="status-mode">READY</span></div>
        <div class="status-item">DATABASE: LOCAL_INDEXED_DB</div>
    </footer>

    <script src="onyx_ui.js"></script>
    <script src="onyx_core.js"></script>
    <script>
        const UI = {
            status: document.getElementById('login-status'),
            name: document.getElementById('login-name'),
            pass: document.getElementById('login-pass')
        };

        function showMsg(msg, isError) {
            UI.status.textContent = msg;
            UI.status.style.display = 'block';
            UI.status.style.background = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)';
            UI.status.style.color = isError ? '#ef4444' : '#10b981';
            UI.status.style.border = `1px solid ${isError ? '#ef4444' : '#10b981'}`;
        }

        document.getElementById('btn-do-login').onclick = async () => {
            const name = UI.name.value.trim();
            const pass = UI.pass.value.trim();
            
            if (!name || !pass) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("Identificação necessária.", true);
                return;
            }

            const user = await OnyxCore.DB.getUser(name);
            if (user && user.password === pass) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('success');
                showMsg("ACESSO AUTORIZADO. Conectando...", false);
                setTimeout(() => OnyxCore.Session.login(name), 1000);
            } else {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("USUÁRIO OU SENHA INVÁLIDOS.", true);
            }
        };

        window.onload = async () => {
            await OnyxCore.DB.init();
            if (OnyxCore.Session.getCurrentUser()) {
                location.href = 'dashboard.html';
            }
        };
    </script>
</body>
</html>
