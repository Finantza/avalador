<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX - Novo Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
    <div class="bg-elements"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <div class="cyber-overlay"><div class="scanline"></div></div>

    <main id="app" class="auth-standalone-wrapper">
        <section id="screen-register" class="auth-card">
            <header>
                <div class="report-badge">REGISTRO DE OPERADOR</div>
                <h1 class="u-font-header">CRIAR CONTA</h1>
                <p>Estabeleça sua identidade no ecossistema Onyx.</p>
            </header>

            <div class="auth-form">
                <div id="reg-status" class="u-status-msg"></div>
                
                <div class="input-group">
                    <label for="reg-name">IDENTIFICAÇÃO (NOME)</label>
                    <input type="text" id="reg-name" placeholder="Ex: Operator_Zero" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="reg-role">TIPO DE PERFIL (FUNÇÃO)</label>
                    <select id="reg-role" class="onyx-select">
                        <option value="aluno">🎒 ESTUDANTE (ALUNO)</option>
                        <option value="gestor">💼 GESTOR (DIREÇÃO / PROFESSOR)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="reg-pass">CÓDIGO DE ACESSO (SENHA)</label>
                    <input type="password" id="reg-pass" placeholder="••••••••" autocomplete="off">
                    <p class="input-hint">Segurança mínima: 4 caracteres alfanuméricos.</p>
                </div>

                <div class="u-mt-30">
                    <button id="btn-do-register" class="btn-onyx btn-primary u-w-full u-mb-15">GERAR CREDENCIAIS</button>
                    <button onclick="location.href='index.html'" class="btn-onyx u-w-full btn-transparent-border">🏠 VOLTAR À HOME</button>
                </div>
            </div>
        </section>
    </main>

    <footer id="system-status" class="u-pos-fixed u-bottom-20 u-left-40 u-border-none u-bg-none u-flex-gap-30">
        <div class="status-item"><span class="status-dot"></span>DB_STATUS: <span class="u-text-primary">ENCRYPTED</span></div>
        <div class="status-item u-opacity-06">DESENVOLVIDO POR <strong class="u-color-white">TECHNOVIE</strong></div>
    </footer>

    <script src="js/onyx_ui.js"></script>
    <script src="js/onyx_core.js"></script>
    <script src="js/onyx_db_manager.js"></script>
    <script>
        const UI = {
            status: document.getElementById('reg-status'),
            name: document.getElementById('reg-name'),
            pass: document.getElementById('reg-pass')
        };

        async function init() {
            if (window.OnyxDBManager) {
                await window.OnyxDBManager.init();
            } else {
                await OnyxCore.DB.init();
            }
        }

        function showMsg(msg, isError) {
            UI.status.textContent = msg;
            UI.status.className = 'u-status-msg ' + (isError ? 'status-error' : 'status-success');
        }

        document.getElementById('btn-do-register').onclick = async () => {
            const name = UI.name.value.trim();
            const pass = UI.pass.value.trim();
            const role = document.getElementById('reg-role').value;
            
            if (!name || !pass || pass.length < 4) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("ERRO: Preencha todos os campos corretamente.", true);
                return;
            }

            const existing = await OnyxCore.DB.getUser(name);
            if (existing) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("ERRO: Identificação já registrada no núcleo.", true);
                return;
            }

            const newUser = { id: name, password: pass, xp: 0, level: 1, role: role };
            await OnyxCore.DB.saveUser(newUser);
            
            if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('success');
            showMsg("SUCESSO: Credenciais geradas. Redirecionando...", false);
            
            setTimeout(() => location.href = 'index.html', 1500);
        };

        window.onload = init;
    </script>
</body>
</html>
