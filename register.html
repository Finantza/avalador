<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX - Novo Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <!-- Legacy Browser & Retro-Compatibility Polyfill Suite (1990-Present) -->
    <script>
        (function() {
            if (!window.console) { window.console = { log: function() {}, error: function() {}, warn: function() {}, info: function() {} }; }
            if (!Array.prototype.forEach) {
                Array.prototype.forEach = function(callback, thisArg) {
                    for (var i = 0; i < this.length; i++) { if (i in this) callback.call(thisArg, this[i], i, this); }
                };
            }
            if (!Array.prototype.map) {
                Array.prototype.map = function(callback, thisArg) {
                    var arr = [];
                    for (var i = 0; i < this.length; i++) { if (i in this) arr.push(callback.call(thisArg, this[i], i, this)); }
                    return arr;
                };
            }
            if (!Array.prototype.indexOf) {
                Array.prototype.indexOf = function(searchElement, fromIndex) {
                    var k = fromIndex || 0;
                    if (k < 0) k = Math.max(0, this.length + k);
                    for (; k < this.length; k++) { if (k in this && this[k] === searchElement) return k; }
                    return -1;
                };
            }
            if (!Array.from) { Array.from = function(object) { return Array.prototype.slice.call(object); }; }
            if (!window.JSON) {
                window.JSON = {
                    parse: function(sJSON) { return eval('(' + sJSON + ')'); },
                    stringify: function(vContent) {
                        if (vContent === null) return "null";
                        if (typeof vContent === "string") return '"' + vContent.replace(/"/g, '\\"') + '"';
                        if (typeof vContent === "number" || typeof vContent === "boolean") return vContent.toString();
                        if (vContent instanceof Array) {
                            var sOutput = "";
                            for (var i = 0; i < vContent.length; i++) sOutput += (sOutput ? "," : "") + window.JSON.stringify(vContent[i]);
                            return "[" + sOutput + "]";
                        }
                        if (typeof vContent === "object") {
                            var sOutput = "";
                            for (var sKey in vContent) {
                                if (Object.prototype.hasOwnProperty.call(vContent, sKey)) {
                                    sOutput += (sOutput ? "," : "") + '"' + sKey + '":' + window.JSON.stringify(vContent[sKey]);
                                }
                            }
                            return "{" + sOutput + "}";
                        }
                        return "undefined";
                    }
                };
            }
            if (!window.localStorage) {
                var storageMock = {
                    _data: {},
                    setItem: function(k, v) { this._data[k] = String(v); },
                    getItem: function(k) { return this._data.hasOwnProperty(k) ? this._data[k] : null; },
                    removeItem: function(k) { delete this._data[k]; },
                    clear: function() { this._data = {}; }
                };
                window.localStorage = storageMock;
                window.sessionStorage = storageMock;
            }
            if (!window.Promise) {
                window.Promise = function(executor) {
                    var self = this;
                    self.status = 'pending'; self.value = undefined;
                    self.onResolvedCallback = []; self.onRejectedCallback = [];
                    function resolve(value) {
                        if (self.status === 'pending') { self.status = 'fulfilled'; self.value = value; for (var i = 0; i < self.onResolvedCallback.length; i++) self.onResolvedCallback[i](value); }
                    }
                    function reject(reason) {
                        if (self.status === 'pending') { self.status = 'rejected'; self.value = reason; for (var i = 0; i < self.onRejectedCallback.length; i++) self.onRejectedCallback[i](reason); }
                    }
                    try { executor(resolve, reject); } catch (e) { reject(e); }
                };
                window.Promise.prototype.then = function(onFulfilled, onRejected) {
                    var self = this;
                    return new window.Promise(function(resolve, reject) {
                        if (self.status === 'fulfilled') {
                            try { var x = onFulfilled(self.value); resolve(x); } catch (e) { reject(e); }
                        } else if (self.status === 'rejected') {
                            try { var x = onRejected(self.value); resolve(x); } catch (e) { reject(e); }
                        } else {
                            self.onResolvedCallback.push(function(val) { try { var x = onFulfilled(val); resolve(x); } catch (e) { reject(e); } });
                            self.onRejectedCallback.push(function(reason) { try { var x = onRejected(reason); resolve(x); } catch (e) { reject(e); } });
                        }
                    });
                };
                window.Promise.resolve = function(val) { return new window.Promise(function(r) { r(val); }); };
            }
            
            // Apple Touch interaction audio unlock
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            var unlockAppleAudio = function() {
                if (window.speechSynthesis && window.speechSynthesis.speak) { var u = new SpeechSynthesisUtterance(''); window.speechSynthesis.speak(u); }
                var ctx = null; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
                if (ctx && ctx.state === 'suspended') { ctx.resume(); }
                document.removeEventListener('click', unlockAppleAudio);
                document.removeEventListener('touchend', unlockAppleAudio);
            };
            document.addEventListener('click', unlockAppleAudio);
            document.addEventListener('touchend', unlockAppleAudio);
        })();
    </script>
</head>
<body class="theme-dark">
    <div class="bg-elements"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <div class="cyber-overlay"><div class="scanline"></div></div>

    <main id="app" class="auth-standalone-wrapper">
        <section id="screen-register" class="auth-card">
            <header>
                <div class="report-badge">REGISTRO DE OPERADOR</div>
                <h1 class="u-font-header">CRIAR CONTA</h1>
                <p>Estabeleça sua identidade no ecossistema Onyx.</p>
            </header>

            <div class="auth-form">
                <div id="reg-status" class="u-status-msg"></div>
                
                <div class="input-group">
                    <label for="reg-name">IDENTIFICAÇÃO (NOME)</label>
                    <input type="text" id="reg-name" placeholder="Ex: Operator_Zero" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="reg-role">TIPO DE PERFIL (FUNÇÃO)</label>
                    <select id="reg-role" class="onyx-select">
                        <option value="aluno">🎒 ESTUDANTE (ALUNO)</option>
                        <option value="gestor">💼 GESTOR (DIREÇÃO / PROFESSOR)</option>
                        <option value="responsavel">👪 RESPONSÁVEL (PAIS / RESPONSÁVEIS)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="reg-pass">CÓDIGO DE ACESSO (SENHA)</label>
                    <input type="password" id="reg-pass" placeholder="••••••••" autocomplete="off">
                    <p class="input-hint">Segurança mínima: 4 caracteres alfanuméricos.</p>
                </div>

                <div class="u-mt-30">
                    <button id="btn-do-register" class="btn-onyx btn-primary u-w-full u-mb-15">GERAR CREDENCIAIS</button>
                    <button onclick="location.href='index.html'" class="btn-onyx u-w-full btn-transparent-border">🏠 VOLTAR À HOME</button>
                </div>
            </div>
        </section>
    </main>

    <footer id="system-status" class="u-pos-fixed u-bottom-20 u-left-40 u-border-none u-bg-none u-flex-gap-30">
        <div class="status-item"><span class="status-dot"></span>DB_STATUS: <span class="u-text-primary">ENCRYPTED</span></div>
        <div class="status-item u-opacity-06">DESENVOLVIDO POR <strong class="u-color-white">TECHNOVIE</strong></div>
    </footer>

    <script src="js/onyx_ui.js"></script>
    <script src="js/onyx_core.js"></script>
    <script src="js/onyx_db_manager.js"></script>
    <script>
        const UI = {
            status: document.getElementById('reg-status'),
            name: document.getElementById('reg-name'),
            pass: document.getElementById('reg-pass')
        };

        async function init() {
            if (window.OnyxDBManager) {
                await window.OnyxDBManager.init();
            } else {
                await OnyxCore.DB.init();
            }
        }

        function showMsg(msg, isError) {
            UI.status.textContent = msg;
            UI.status.className = 'u-status-msg ' + (isError ? 'status-error' : 'status-success');
        }

        document.getElementById('btn-do-register').onclick = async () => {
            const name = UI.name.value.trim();
            const pass = UI.pass.value.trim();
            const role = document.getElementById('reg-role').value;
            
            if (!name || !pass || pass.length < 4) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("ERRO: Preencha todos os campos corretamente.", true);
                return;
            }

            const existing = await OnyxCore.DB.getUser(name);
            if (existing) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("ERRO: Identificação já registrada no núcleo.", true);
                return;
            }

            const hashedPassword = await OnyxCore.Crypto.hashSHA256(pass);
            const initialLevel = (role === 'gestor') ? 10 : 1;
            const initialXP = (role === 'gestor') ? 300 : 0;
            const newUser = { id: name, password: hashedPassword, xp: initialXP, level: initialLevel, role: role };
            await OnyxCore.DB.saveUser(newUser);
            
            if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('success');
            showMsg("SUCESSO: Credenciais geradas. Redirecionando...", false);
            
            setTimeout(() => location.href = 'index.html', 1500);
        };

        window.onload = init;
    </script>
</body>
</html>
