<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX - Novo Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
    <div class="bg-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="cyber-overlay">
        <div class="scanline"></div>
        <div class="noise"></div>
    </div>

    <main id="app">
        <section id="screen-register" class="screen active">
            <div class="card glass">
                <header>
                    <div class="logo">AVALIAÇÃO DE<span> TECNOLOGIA</span></div>
                    <h1>Novo Cadastro</h1>
                    <p>Preencha os dados para criar sua credencial</p>
                </header>

                <div class="auth-form-standalone">
                    <div id="reg-status" class="u-status-msg"></div>
                    <div class="input-group">
                        <label for="reg-name">NOME COMPLETO</label>
                        <input type="text" id="reg-name" placeholder="Seu nome completo" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="reg-pass">DEFINA UMA SENHA</label>
                        <input type="password" id="reg-pass" placeholder="Sua senha segura" autocomplete="off">
                        <p class="input-hint">Mínimo de 4 caracteres</p>
                    </div>
                    <div class="auth-form-actions">
                        <button id="btn-do-register" class="btn-primary">CRIAR CREDENCIAL</button>
                        <button onclick="location.href='index.html'" class="btn-text">Já possui conta? Faça Login</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="system-status" class="u-pos-fixed u-bottom-20 u-left-40 u-border-none u-bg-none u-flex-gap-30">
        <div class="status-item"><span class="status-dot"></span>ONYX_CORE: <span class="u-text-primary">READY</span></div>
        <div class="status-item u-opacity-06">DESENVOLVIDO POR <strong style="color:#fff;">TECHNOVIE</strong></div>
    </footer>

    <script src="onyx_ui.js"></script>
    <script src="onyx_core.js"></script>
    <script>
        const UI = {
            status: document.getElementById('reg-status'),
            name: document.getElementById('reg-name'),
            pass: document.getElementById('reg-pass')
        };

        function showMsg(msg, isError) {
            UI.status.textContent = msg;
            UI.status.style.display = 'block';
            UI.status.style.background = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)';
            UI.status.style.color = isError ? '#ef4444' : '#10b981';
            UI.status.style.border = `1px solid ${isError ? '#ef4444' : '#10b981'}`;
        }

        document.getElementById('btn-do-register').onclick = async () => {
            const name = UI.name.value.trim();
            const pass = UI.pass.value.trim();
            
            if (!name || !pass || pass.length < 4) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("Preencha o nome e uma senha válida (mín. 4 caracteres).", true);
                return;
            }

            const existing = await OnyxCore.DB.getUser(name);
            
            if (existing && existing.password) {
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                showMsg("USUÁRIO JÁ CADASTRADO NO SISTEMA.", true);
                return;
            }

            const newUser = {
                id: name,
                password: pass,
                xp: 0,
                level: 1
            };
            
            await OnyxCore.DB.saveUser(newUser);
            
            if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('success');
            showMsg("CADASTRO REALIZADO COM SUCESSO! Redirecionando...", false);
            
            setTimeout(() => location.href = 'index.html', 2000);
        };
    </script>
</body>
</html>
