<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX - Missão Ativa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-dark">
    <div class="bg-elements"><div class="blob blob-1"></div></div>
    <div class="cyber-overlay"><div class="scanline"></div></div>

    <main id="app">
        <section id="screen-quiz" class="screen active">
            <div class="quiz-header">
                <div class="student-info">
                    <span id="display-name">OPERADOR</span>
                    <button onclick="abandonQuiz()" class="btn-onyx btn-abandon">
                        🏠 VOLTAR À HOME
                    </button>
                    <div class="streak-badge" id="streak-badge">
                        <span class="fire-icon">🔥</span>
                        <span id="streak-count">0</span>
                    </div>
                    <div class="streak-badge active streak-badge-combo">
                        <span>COMBO</span>
                        <span id="combo-multiplier" class="u-weight-900">1.0x</span>
                    </div>
                    <div class="streak-badge active streak-badge-lives" id="lives-container">
                        <span class="life-icon">❤️</span><span class="life-icon">❤️</span><span class="life-icon">❤️</span>
                    </div>
                    <div class="streak-badge active" style="border-color: #facc15; color: #facc15;">
                        <span class="u-weight-900">🪙 <span id="quiz-coins">0</span></span>
                    </div>
                </div>
                <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                <div class="quiz-stats">QUESTÃO <span id="current-q">1</span>/<span id="total-q">10</span></div>
            </div>

            <div class="quiz-card glass">
                <div id="timer-container" class="timer-container">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="timer-path" id="timer-path" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <span id="timer-text">30s</span>
                </div>
                <div class="question-section">
                    <div class="question-header-layout">
                        <p id="question-text" class="glitch-text question-text-grow">INICIALIZANDO PROTOCOLO...</p>
                        <button id="btn-speak" class="btn-onyx btn-speak-primary">
                            🔊 OUVIR
                        </button>
                    </div>
                    <div id="tactical-toolbar" class="u-flex u-gap-10 u-mb-15" style="flex-wrap: wrap; justify-content: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                        <button id="btn-tutor" class="btn-onyx" style="padding:5px 10px; font-size:0.75rem; border-color: #0ea5e9; color: #0ea5e9;">✨ TUTOR (<span id="inv-tutor-qty">0</span>)</button>
                        <button id="btn-use-life" class="btn-onyx" style="padding:5px 10px; font-size:0.75rem; background: rgba(239,68,68,0.2); border-color: var(--error);">❤️ VIDA (<span id="inv-life-qty">0</span>)</button>
                        <button id="btn-use-fifty" class="btn-onyx" style="padding:5px 10px; font-size:0.75rem; background: rgba(245,158,11,0.2); border-color: #f59e0b;">✂️ 50/50 (<span id="inv-fifty-qty">0</span>)</button>
                        <button id="btn-use-time" class="btn-onyx" style="padding:5px 10px; font-size:0.75rem; background: rgba(16,185,129,0.2); border-color: #10b981;">⏳ TEMPO (<span id="inv-time-qty">0</span>)</button>
                        <button id="btn-use-skip" class="btn-onyx" style="padding:5px 10px; font-size:0.75rem; background: rgba(139,92,246,0.2); border-color: #8b5cf6;">⏭️ PULAR (<span id="inv-skip-qty">0</span>)</button>
                    </div>
                    <div id="options-container" class="options-container"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Floating Tutor Panel -->
    <div id="tutor-floating-panel" class="tutor-floating-panel">
        <div class="tutor-header">
            <span class="tutor-icon">🤖</span>
            <span>ONYX TUTOR</span>
            <button onclick="document.getElementById('tutor-floating-panel').classList.remove('active')" class="btn-tutor-close">✕</button>
        </div>
        <div id="tutor-floating-content" class="tutor-floating-body"></div>
    </div>

    <!-- Level Up Screen Overlay -->
    <div id="level-up-overlay" class="level-up-overlay">
        <div class="level-up-container">
            <div class="level-up-badge-glow">👑</div>
            <div class="level-up-title">LEVEL UP!</div>
            <div class="u-text-muted u-mb-30" style="font-size: 1.2rem;">Você alcançou o Nível <span id="level-up-num" style="color: var(--accent); font-weight: 900;">2</span>!</div>
            <button id="level-up-btn-prosseguir" class="btn-onyx btn-primary" style="padding: 10px 30px; font-weight: 800; cursor: pointer; display: inline-block;">PROSSEGUIR</button>
        </div>
    </div>

    <!-- Streak Alert Toast -->
    <div id="streak-alert-toast" class="streak-alert-toast">
        <span style="font-size: 2rem;">🔥</span>
        <div>
            <div class="u-weight-900 u-color-white" style="font-size: 1.1rem; text-align: left;">STREAK IMPLACÁVEL!</div>
            <div class="u-font-08" style="color: var(--accent); text-align: left;"><span id="streak-alert-num">5</span> Acertos Consecutivos!</div>
        </div>
    </div>

    <!-- Achievement Toast -->
    <div id="achievement-toast" class="achievement-toast">
        <span class="achievement-toast-icon">🏆</span>
        <div>
            <div class="u-weight-900 u-color-white" style="font-size: 0.9rem; text-align: left;">CONQUISTA DESTRAVADA!</div>
            <div class="u-font-08 u-text-muted" id="achievement-toast-title" style="text-align: left;">Título da Conquista</div>
        </div>
    </div>

    <script src="js/onyx_core.js"></script>
    <script src="js/onyx_db_manager.js"></script>
    <script src="js/onyx_database.js"></script>
    <script src="js/onyx_engines.js"></script>
    <script src="js/onyx_ui.js"></script>
    <script src="legacy/tutor.js"></script>
    <script>
        let userName = null;
        let userStats = null;
        let subject = 'python';
        let difficulty = 'easy';

        let currentQuestionIndex = 0;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let tutorConsultedCount = 0;
        let timesList = [];
        let questionStartTime = 0;
        let lives = 3;
        let comboMultiplier = 1.0;
        let totalXPGained = 0;
        let questions = [];
        let timerInterval;
        let timeLeft = 30;
        let isAnswering = false;
        let tutorRequested = false;

        window.showTutorHint = function(explanationText) {
            const panel = document.getElementById('tutor-floating-panel');
            const content = document.getElementById('tutor-floating-content');
            if (panel && content) {
                content.innerHTML = explanationText;
                panel.classList.add('active');
                
                // Play sound if UI available
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');
                
                // Auto hide after 8 seconds
                setTimeout(() => {
                    panel.classList.remove('active');
                }, 8000);
            }
        };

        function playWarningTick() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.02, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function triggerStreakAlert(streakVal) {
            const toast = document.getElementById('streak-alert-toast');
            const countSpan = document.getElementById('streak-alert-num');
            if (toast && countSpan) {
                countSpan.textContent = streakVal;
                toast.classList.add('active');
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('alert');
                }
                setTimeout(() => {
                    toast.classList.remove('active');
                }, 2000);
            }
        }

        function showLevelUpAnimation(newLevel) {
            const overlay = document.getElementById('level-up-overlay');
            const levelNumSpan = document.getElementById('level-up-num');
            if (overlay && levelNumSpan) {
                levelNumSpan.textContent = newLevel;
                overlay.classList.add('active');
                
                // Play ascending major arpeggio synth
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    const freqs = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // C major
                    freqs.forEach((f, index) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + index * 0.08);
                        
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.12, now + index * 0.08 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.08 + 0.4);
                        
                        osc.start(now + index * 0.08);
                        osc.stop(now + index * 0.08 + 0.4);
                    });
                } catch(e) {}
            }
        }

        async function startMission() {
            userName = await OnyxCore.Session.checkAuth();
            if (!userName) return;

            subject = sessionStorage.getItem('onyx_subject') || 'python';
            difficulty = sessionStorage.getItem('onyx_difficulty') || 'easy';
            const year = sessionStorage.getItem('onyx_year') || 'all';

            const displayNameEl = document.getElementById('display-name');
            if (displayNameEl) {
                displayNameEl.textContent = userName;
            }

            if (typeof OnyxUI !== 'undefined') OnyxUI.init();
            
            // Progression gate validation (prevents playing locked content after level loss)
            try {
                userStats = await OnyxCore.DB.getUser(userName);
                if (userStats) {
                    document.getElementById('quiz-coins').textContent = userStats.coins || 0;
                    
                    const subReq = OnyxCore.ProgressionConfig.subjects[subject] || 1;
                    const diffReq = OnyxCore.ProgressionConfig.difficulties[difficulty] || 1;
                    
                    if (userStats.level < subReq || userStats.level < diffReq) {
                        alert("🔴 [ACESSO NEGADO] Esta matéria ou nível foi bloqueado devido ao seu rebaixamento de nível!");
                        location.href = 'dashboard.html';
                        return;
                    }
                }
            } catch (err) {
                console.error("[QUIZ] Erro ao validar travas de nível:", err);
            }
            
            console.log(`[QUIZ] Gerando novo banco de questões: ${subject} (${difficulty}) - Ano: ${year}`);
            questions = await OnyxEngines.QuestionEngine.generateQuestions(userName, subject, difficulty, 10, year);
            
            // Recupera configurações de acessibilidade do Tutor salvas ou cria padrão
            const tutorConfigStr = localStorage.getItem(`onyx_tutor_config_${userName}`);
            let tutorConfig = {
                ritmo: 'normal',
                estilo: 'visual',
                autoSimplificar: false
            };
            if (tutorConfigStr) {
                try {
                    tutorConfig = JSON.parse(tutorConfigStr);
                } catch(e) {}
            }

            // Inicializa o Tutor Inteligente
            window.tutorAI = new TutorInteligente({
                nome: 'OnyxTutor',
                estudanteNome: userName || 'Operador',
                ritmoAprendizagem: tutorConfig.ritmo,
                estiloAprendizagem: tutorConfig.estilo,
                simplificacaoTexto: tutorConfig.autoSimplificar
            });
            
            // Registra a matéria do quiz
            tutorAI.registrarMateria({
                id: subject,
                nome: subject.toUpperCase(),
                conceitos: []
            });

            // Adiciona as questões e inicia a sessão no Tutor Inteligente
            const tutorQuestions = questions.map((q, idx) => ({
                id: `q_${idx}`,
                materiaId: subject,
                enunciado: q.text,
                alternativas: q.options,
                respostaCorreta: q.options[q.correct],
                dificuldade: difficulty === 'easy' ? 'facil' : (difficulty === 'medium' ? 'medio' : 'dificil'),
                explicacao: q.explanation || `Aplicação prática de ${subject}`,
                dicas: [q.hint || 'Pense bem nas alternativas!']
            }));
            tutorAI.adicionarQuestoes(tutorQuestions);
            tutorAI.iniciarSessao(subject, { quantidade: questions.length });

            renderQuestion();
        }

        function renderQuestion() {
            isAnswering = false;
            tutorRequested = false;
            questionStartTime = Date.now();
            
            // Cancela síntese de voz ativa ao mudar de questão
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            
            const q = questions[currentQuestionIndex];
            
            const textElement = document.getElementById('question-text');
            textElement.style.fontSize = ''; // Reset font size
            textElement.style.lineHeight = ''; // Reset line-height
            
            // Aplica simplificação automática se configurado
            const autoSimplify = window.tutorAI && window.tutorAI.estudante.acessibilidade.simplificacaoTexto;
            if (autoSimplify) {
                tutorRequested = true;
                tutorConsultedCount++;
                let simplified = tutorAI.simplificarTexto(q.text, 'moderado');
                let highlighted = OnyxCore.Tutor.simplifyText(simplified);
                textElement.innerHTML = highlighted;
                textElement.style.fontSize = '1.3rem';
                textElement.style.lineHeight = '1.6';
            } else {
                textElement.textContent = q.text;
            }
            
            document.getElementById('current-q').textContent = currentQuestionIndex + 1;
            document.getElementById('total-q').textContent = questions.length;
            
            // Progress
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Reset Timer
            resetTimer();

            // Atualizar UI do inventário
            const updateToolbarUI = () => {
                if(userStats && userStats.inventory) {
                    document.getElementById('inv-tutor-qty').textContent = userStats.inventory.tutor || 0;
                    document.getElementById('inv-life-qty').textContent = userStats.inventory.life || 0;
                    document.getElementById('inv-fifty-qty').textContent = userStats.inventory.fifty || 0;
                    document.getElementById('inv-time-qty').textContent = userStats.inventory.time || 0;
                    document.getElementById('inv-skip-qty').textContent = userStats.inventory.skip || 0;
                }
            };
            updateToolbarUI();

            const consumeItem = (itemKey) => {
                if (!userStats || !userStats.inventory || (userStats.inventory[itemKey] || 0) <= 0) {
                    if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');
                    alert(`⚠️ Sem saldo para este item! Compre mais na Loja Onyx.`);
                    return false;
                }
                userStats.inventory[itemKey] -= 1;
                OnyxCore.DB.saveUser(userStats);
                updateToolbarUI();
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');
                return true;
            };

            // 1. Tutor
            const btnTutor = document.getElementById('btn-tutor');
            if (btnTutor) {
                btnTutor.style.opacity = '1';
                btnTutor.onclick = () => {
                    if (btnTutor.style.opacity === '0.5') return;
                    if (!autoSimplify && !consumeItem('tutor')) return;

                    if (!tutorRequested) {
                        tutorRequested = true;
                        tutorConsultedCount++;
                    }
                    
                    let simplified = tutorAI.simplificarTexto(q.text, 'moderado');
                    let highlighted = OnyxCore.Tutor.simplifyText(simplified);
                    
                    textElement.innerHTML = highlighted;
                    textElement.style.fontSize = '1.3rem';
                    textElement.style.lineHeight = '1.6';
                    btnTutor.style.opacity = '0.5';
                    
                    timeLeft += 15;
                    updateTimerUI();
                };
                if (autoSimplify) btnTutor.style.opacity = '0.5';
            }

            // 2. Life
            const btnLife = document.getElementById('btn-use-life');
            if (btnLife) {
                btnLife.style.opacity = lives < 3 ? '1' : '0.5';
                btnLife.onclick = () => {
                    if (lives >= 3) {
                        alert("Sua vida já está cheia!");
                        return;
                    }
                    if (!consumeItem('life')) return;
                    lives++;
                    updateLivesUI();
                    btnLife.style.opacity = lives < 3 ? '1' : '0.5';
                };
            }

            // 3. 50/50
            const btnFifty = document.getElementById('btn-use-fifty');
            if (btnFifty) {
                btnFifty.style.opacity = '1';
                btnFifty.onclick = () => {
                    if (btnFifty.style.opacity === '0.5') return;
                    if (!consumeItem('fifty')) return;
                    
                    const options = document.querySelectorAll('.option-btn');
                    let wrongIndexes = [];
                    q.options.forEach((opt, idx) => {
                        if (idx !== q.correct) wrongIndexes.push(idx);
                    });
                    // Shuffle and pick 2
                    wrongIndexes.sort(() => Math.random() - 0.5);
                    const toRemove = wrongIndexes.slice(0, 2);
                    toRemove.forEach(idx => {
                        if (options[idx]) {
                            options[idx].style.opacity = '0.2';
                            options[idx].style.pointerEvents = 'none';
                        }
                    });
                    btnFifty.style.opacity = '0.5';
                };
            }

            // 4. Time
            const btnTime = document.getElementById('btn-use-time');
            if (btnTime) {
                btnTime.style.opacity = '1';
                btnTime.onclick = () => {
                    if (btnTime.style.opacity === '0.5') return;
                    if (!consumeItem('time')) return;
                    timeLeft += 30;
                    updateTimerUI();
                    btnTime.style.opacity = '0.5';
                };
            }

            // 5. Skip
            const btnSkip = document.getElementById('btn-use-skip');
            if (btnSkip) {
                btnSkip.style.opacity = '1';
                btnSkip.onclick = () => {
                    if (btnSkip.style.opacity === '0.5') return;
                    if (!consumeItem('skip')) return;
                    btnSkip.style.opacity = '0.5';
                    
                    clearInterval(timerInterval);
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        renderQuestion();
                    } else {
                        finishMission(false);
                    }
                };
            }

            // Voice Speech (Leitura em Voz Alta) Logic
            const btnSpeak = document.getElementById('btn-speak');
            if (btnSpeak) {
                btnSpeak.onclick = () => {
                    if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');
                    
                    // Cancela síntese anterior
                    window.speechSynthesis.cancel();
                    
                    const textToSpeak = textElement.innerText || q.text;
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    utterance.lang = 'pt-BR';
                    
                    let speed = 1.0;
                    if (tutorAI.ritmoAprendizagem === 'lento') speed = 0.8;
                    else if (tutorAI.ritmoAprendizagem === 'rapido') speed = 1.2;
                    utterance.rate = speed;
                    
                    utterance.onstart = () => {
                        btnSpeak.innerHTML = '🔊 FALANDO...';
                        btnSpeak.style.opacity = '0.7';
                    };
                    utterance.onend = () => {
                        btnSpeak.innerHTML = '🔊 OUVIR';
                        btnSpeak.style.opacity = '1';
                    };
                    utterance.onerror = () => {
                        btnSpeak.innerHTML = '🔊 OUVIR';
                        btnSpeak.style.opacity = '1';
                    };
                    
                    window.speechSynthesis.speak(utterance);
                };
                
                btnSpeak.innerHTML = '🔊 OUVIR';
                btnSpeak.style.opacity = '1';
            }

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-index">${String.fromCharCode(65 + i)}</span> ${opt}`;
                btn.onclick = () => handleAnswer(i, btn);
                container.appendChild(btn);
            });
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    handleAnswer(-1); // Timeout
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('timer-text').textContent = `${timeLeft}s`;
            const offset = 283 - (timeLeft / 30) * 283;
            const timerPath = document.getElementById('timer-path');
            if (timerPath) {
                timerPath.style.strokeDashoffset = offset;
                timerPath.classList.remove('timer-warning', 'timer-critical');
                if (timeLeft <= 5) {
                    timerPath.classList.add('timer-critical');
                    playWarningTick();
                } else if (timeLeft <= 10) {
                    timerPath.classList.add('timer-warning');
                }
            }
        }

        function handleAnswer(idx, clickedBtn = null) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timerInterval);

            // Cancela síntese de voz ativa quando o usuário responde
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            const timeSpentOnQuestion = Math.max(0.1, (Date.now() - questionStartTime) / 1000);
            timesList.push(timeSpentOnQuestion);

            const q = questions[currentQuestionIndex];
            const isCorrect = idx === q.correct;
            
            // Registra a resposta no Tutor Inteligente
            const userAnswerText = idx === -1 ? 'TEMPO ESGOTADO' : q.options[idx];
            tutorAI.responderQuestao(`q_${currentQuestionIndex}`, userAnswerText);
            
            const difficultyMultiplier = { easy: 10, medium: 20, hard: 40, insane: 80, impossible: 150, suicida: 500 };
            const baseXP = difficultyMultiplier[difficulty] || 10;

            if (isCorrect) {
                score++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;
                
                // Speed Bonus
                const speedBonus = (timeLeft / 30); // up to +1.0
                comboMultiplier = Math.min(3.0, 1.0 + (streak * 0.1) + speedBonus).toFixed(1);
                
                const earnedXP = Math.floor(baseXP * parseFloat(comboMultiplier));
                totalXPGained += earnedXP;
                
                // Moedas
                const earnedCoins = Math.floor(10 * parseFloat(comboMultiplier));
                if (userStats) {
                    userStats.coins = (userStats.coins || 0) + earnedCoins;
                    document.getElementById('quiz-coins').textContent = userStats.coins;
                }
                
                if (clickedBtn) clickedBtn.classList.add('correct');
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('success');
                    OnyxUI.showXPGain(earnedXP);
                }
                
                // Normal timeout for correct answer
                setTimeout(nextStep, 1000);
            } else {
                streak = 0;
                comboMultiplier = 1.0;
                lives--;
                updateLivesUI();
                
                if (clickedBtn) clickedBtn.classList.add('wrong');
                // Show correct one
                const btns = document.querySelectorAll('.option-btn');
                if (btns[q.correct]) btns[q.correct].classList.add('correct-hint');
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');

                // Recupera a análise do Tutor Inteligente
                const tutorQ = tutorAI.conhecimento.questoes.find(quest => quest.id === `q_${currentQuestionIndex}`);
                const tutorFeedbackObj = tutorAI.gerarFeedback(tutorQ);
                const tutorDicaStr = tutorAI.gerarDica(tutorQ);
                
                // Explicação cognitivamente simplificada e jargões destacados
                const rawExplanation = q.explanation || `Aqui usamos ${q.options[q.correct]} porque é o conceito adequado para resolver a questão.`;
                const simplifiedExplanation = tutorAI.simplificarTexto(rawExplanation, 'moderado');
                const highlightedExplanation = OnyxCore.Tutor.simplifyText(simplifiedExplanation);

                if (tutorRequested) {
                    // Tutor Feedback
                    const container = document.getElementById('options-container');
                    const feedbackDiv = document.createElement('div');
                    feedbackDiv.className = 'glass u-mt-20 u-p-15';
                    feedbackDiv.style.borderLeft = '4px solid var(--error)';
                    feedbackDiv.innerHTML = `
                        <p class="u-font-08 u-text-error u-mb-5 u-weight-900">🤖 ${tutorFeedbackObj.texto}</p>
                        <p class="u-font-09">A resposta correta era <strong>"${q.options[q.correct]}"</strong>.</p>
                        <p class="u-font-09 u-mt-10 u-opacity-08">${highlightedExplanation}</p>
                        ${tutorDicaStr ? `<p class="u-font-08 u-mt-10" style="color:var(--accent); font-weight: bold;">💡 Dica de Aprendizagem: ${tutorDicaStr}</p>` : ''}
                        <div class="u-mt-15 u-flex-between" style="align-items: center; gap: 10px; flex-wrap: wrap;">
                            <button id="btn-speak-feedback" class="btn-speak-primary" style="margin-left: 0;">
                                🔊 OUVIR EXPLICAÇÃO
                            </button>
                            <span id="feedback-timer-label" class="u-font-07 u-text-accent">(Carregando próxima em 5s...)</span>
                        </div>
                    `;
                    container.appendChild(feedbackDiv);
                    
                    let nextTimeout = setTimeout(nextStep, 5000);
                    
                    const speakFeedbackBtn = feedbackDiv.querySelector('#btn-speak-feedback');
                    if (speakFeedbackBtn) {
                        speakFeedbackBtn.onclick = () => {
                            if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');
                            
                            // Cancela o timeout de avanço automático
                            clearTimeout(nextTimeout);
                            
                            // Substitui o timer de avanço automático por um botão de Avançar manual
                            const label = feedbackDiv.querySelector('#feedback-timer-label');
                            if (label) {
                                label.outerHTML = `
                                    <button id="btn-manual-next" class="btn-onyx" style="padding: 6px 12px; font-size: 0.7rem; background: var(--primary); color: #fff; box-shadow: 0 4px 12px var(--primary-glow);">
                                        AVANÇAR
                                    </button>
                                `;
                                const manualNext = feedbackDiv.querySelector('#btn-manual-next');
                                if (manualNext) {
                                    manualNext.onclick = () => {
                                        if (window.speechSynthesis) window.speechSynthesis.cancel();
                                        nextStep();
                                    };
                                }
                            }
                            
                            window.speechSynthesis.cancel();
                            
                            // Compila o áudio
                            const textToSpeak = `Feedback do Tutor: ${tutorFeedbackObj.texto}. A resposta correta era ${q.options[q.correct]}. Explicação: ${simplifiedExplanation}. Dica de Aprendizagem: ${tutorDicaStr || ''}`;
                            const utterance = new SpeechSynthesisUtterance(textToSpeak);
                            utterance.lang = 'pt-BR';
                            
                            let speed = 1.0;
                            if (tutorAI.ritmoAprendizagem === 'lento') speed = 0.8;
                            else if (tutorAI.ritmoAprendizagem === 'rapido') speed = 1.2;
                            utterance.rate = speed;
                            
                            utterance.onstart = () => {
                                speakFeedbackBtn.innerHTML = '🔊 LENDO EXPLICAÇÃO...';
                                speakFeedbackBtn.style.opacity = '0.7';
                            };
                            utterance.onend = () => {
                                speakFeedbackBtn.innerHTML = '🔊 OUVIR EXPLICAÇÃO';
                                speakFeedbackBtn.style.opacity = '1';
                            };
                            utterance.onerror = () => {
                                speakFeedbackBtn.innerHTML = '🔊 OUVIR EXPLICAÇÃO';
                                speakFeedbackBtn.style.opacity = '1';
                            };
                            
                            window.speechSynthesis.speak(utterance);
                        };
                    }
                } else {
                    setTimeout(nextStep, 2500); // Standard wait for wrong answer
                }
            }

            document.getElementById('streak-count').textContent = streak;
            document.getElementById('combo-multiplier').textContent = `${comboMultiplier}x`;
            if (streak >= 3) document.getElementById('streak-badge').classList.add('active');
            else document.getElementById('streak-badge').classList.remove('active');

            function nextStep() {
                // Cancela qualquer áudio ativo quando muda de questão
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                
                currentQuestionIndex++;
                if (lives <= 0) {
                    finishMission(true); // Failed
                } else if (currentQuestionIndex < questions.length) {
                    renderQuestion();
                } else {
                    finishMission(false);
                }
            }
        }

        function updateLivesUI() {
            const lc = document.getElementById('lives-container');
            lc.innerHTML = '';
            for(let i=0; i<3; i++) {
                lc.innerHTML += `<span class="life-icon" style="${i >= lives ? 'opacity:0.2; filter:grayscale(1);' : ''}">❤️</span>`;
            }
        }

        async function finishMission(failed = false) {
            sessionStorage.setItem('onyx_final_score', score);
            
            try {
                let stats = await OnyxCore.DB.getUser(userName);
                if (!stats) stats = { id: userName, level: 1, xp: 0 };
                
                // Sincronizar moedas e inventario
                if (userStats) {
                    stats.coins = userStats.coins;
                    if (userStats.inventory) stats.inventory = userStats.inventory;
                }
                
                if (failed) {
                    totalXPGained = 0; // No XP gained on critical failure
                    // Penalidade de nível e zerar XP foi removida
                } else {
                    const totalTimeSpent = timesList.reduce((sum, t) => sum + t, 0);
                    // Use advanced upgraded Heuristic Score engine to calculate reward
                    totalXPGained = OnyxEngines.calculateHeuristicScore(score, questions.length, totalTimeSpent, difficulty, {
                        maxStreak: maxStreak,
                        tutorConsultedCount: tutorConsultedCount,
                        historyTimes: timesList
                    });

                    stats.xp = (stats.xp || 0) + totalXPGained;
                    
                    // Update Bounties (Added to stats.xp BEFORE level-up check)
                    if (stats.bounties) {
                        const q = stats.bounties.quests.find(x => x.type === 'play_subject' && x.target === subject && !x.done);
                        if (q) {
                            q.current++;
                            if (q.current >= q.amount) {
                                q.done = true;
                                stats.xp += q.reward;
                            }
                        }
                    }

                    // Level Up calculations (Includes both mission and daily bounty XP rewards)
                    let nextXP = (stats.level || 1) * 100;
                    while (stats.xp >= nextXP) {
                        stats.level++;
                        stats.xp -= nextXP;
                        nextXP = stats.level * 100;
                    }
                }

                await OnyxCore.DB.saveUser(stats);
                
                // Save upgraded history record
                await OnyxCore.DB.saveHistory({ 
                    user: userName, 
                    subject, 
                    difficulty, 
                    score, 
                    total: questions.length,
                    xpGained: totalXPGained, 
                    failed,
                    timeSpent: timesList.reduce((sum, t) => sum + t, 0),
                    tutorConsultedCount: tutorConsultedCount,
                    maxStreak: maxStreak,
                    timesList: timesList
                });
                console.log(`[QUIZ] Missão concluída com Heurística Upgraded: +${totalXPGained} XP`);

                // Salva o relatório de estudo cognitivo do Tutor
                try {
                    const report = tutorAI.relatorioEstudante();
                    localStorage.setItem(`onyx_tutor_report_${userName}`, JSON.stringify(report));
                } catch (e) {
                    console.error("[QUIZ] Erro ao salvar relatório cognitivo do tutor:", e);
                }
            } catch (err) {
                console.error("[QUIZ] Erro ao salvar progresso:", err);
            }
            
            location.href = 'results.html';
        }

        function abandonQuiz() {
            if (confirm("⚠️ ABANDONAR QUEST\n\nTem certeza que deseja desistir desta missão e voltar para a Home? Seu progresso atual nesta missão será perdido.")) {
                location.href = OnyxCore.Session.getHomeURL();
            }
        }

        window.onload = async () => {
            if (window.OnyxDBManager) {
                await window.OnyxDBManager.init();
            } else {
                await OnyxCore.DB.init();
            }
            startMission();
        };
    </script>
</body>
</html>
