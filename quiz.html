<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONYX - Missão Ativa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
    <div class="bg-elements"><div class="blob blob-1"></div></div>
    <div class="cyber-overlay"><div class="scanline"></div></div>

    <main id="app">
        <section id="screen-quiz" class="screen active">
            <div class="quiz-header">
                <div class="student-info">
                    <span id="display-name">OPERADOR</span>
                    <div class="streak-badge" id="streak-badge">
                        <span class="fire-icon">🔥</span>
                        <span id="streak-count">0</span>
                    </div>
                    <div class="streak-badge active" style="border-color: #10b981; background: rgba(16, 185, 129, 0.1); color: #10b981;">
                        <span>COMBO</span>
                        <span id="combo-multiplier" class="u-weight-900">1.0x</span>
                    </div>
                    <div class="streak-badge active" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.1); color: #ef4444; gap: 4px;" id="lives-container">
                        <span class="life-icon">❤️</span><span class="life-icon">❤️</span><span class="life-icon">❤️</span>
                    </div>
                </div>
                <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
                <div class="quiz-stats">QUESTÃO <span id="current-q">1</span>/10</div>
            </div>

            <div class="quiz-card glass">
                <div id="timer-container" class="timer-container">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="timer-path" id="timer-path" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <span id="timer-text">20s</span>
                </div>
                <div class="question-section">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 20px;">
                        <p id="question-text" class="glitch-text" style="flex:1;">INICIALIZANDO PROTOCOLO...</p>
                        <button id="btn-tutor" class="btn-onyx" style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid #10b981; padding: 5px 10px; font-size: 0.7rem; margin-left: 15px; flex-shrink: 0;">
                            ✨ TUTOR
                        </button>
                    </div>
                    <div id="options-container" class="options-container"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Floating Tutor Panel -->
    <div id="tutor-floating-panel" class="tutor-floating-panel hidden">
        <div class="tutor-header">
            <span class="tutor-icon">🤖</span>
            <span>ONYX TUTOR</span>
            <button onclick="document.getElementById('tutor-floating-panel').classList.remove('active')" style="margin-left:auto; background:none; border:none; color:var(--accent); cursor:pointer;">✕</button>
        </div>
        <div id="tutor-floating-content" style="font-size: 12px; line-height: 1.5; color: #fff;"></div>
    </div>

    <script src="onyx_ui.js"></script>
    <script src="onyx_database.js"></script>
    <script src="onyx_engines.js"></script>
    <script src="onyx_core.js"></script>
    <script>
        OnyxCore.Session.checkAuth();
        const userName = OnyxCore.Session.getCurrentUser();
        const subject = sessionStorage.getItem('onyx_subject') || 'python';
        const difficulty = sessionStorage.getItem('onyx_difficulty') || 'easy';
        
        document.getElementById('display-name').textContent = userName;

        let currentQuestionIndex = 0;
        let score = 0;
        let streak = 0;
        let lives = 3;
        let comboMultiplier = 1.0;
        let totalXPGained = 0;
        let questions = [];
        let timerInterval;
        let timeLeft = 20;
        let isAnswering = false;
        let tutorRequested = false;

        window.showTutorHint = function(explanationText) {
            const panel = document.getElementById('tutor-floating-panel');
            const content = document.getElementById('tutor-floating-content');
            if (panel && content) {
                content.innerHTML = explanationText;
                panel.classList.add('active');
                
                // Play sound if UI available
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');
                
                // Auto hide after 8 seconds
                setTimeout(() => {
                    panel.classList.remove('active');
                }, 8000);
            }
        };

        async function startMission() {
            if (typeof OnyxUI !== 'undefined') OnyxUI.init();
            
            // Progression gate validation (prevents playing locked content after level loss)
            try {
                const stats = await OnyxCore.DB.getUser(userName);
                if (stats) {
                    const subReq = OnyxCore.ProgressionConfig.subjects[subject] || 1;
                    const diffReq = OnyxCore.ProgressionConfig.difficulties[difficulty] || 1;
                    
                    if (stats.level < subReq || stats.level < diffReq) {
                        alert("🔴 [ACESSO NEGADO] Esta matéria ou nível foi bloqueado devido ao seu rebaixamento de nível!");
                        location.href = 'dashboard.html';
                        return;
                    }
                }
            } catch (err) {
                console.error("[QUIZ] Erro ao validar travas de nível:", err);
            }
            
            console.log(`[QUIZ] Gerando novo banco de questões: ${subject} (${difficulty})`);
            questions = await OnyxEngines.QuestionEngine.generateQuestions(userName, subject, difficulty, 10);
            
            renderQuestion();
        }

        function renderQuestion() {
            isAnswering = false;
            tutorRequested = false;
            const q = questions[currentQuestionIndex];
            
            const textElement = document.getElementById('question-text');
            textElement.textContent = q.text;
            textElement.style.fontSize = ''; // reset font
            
            document.getElementById('current-q').textContent = currentQuestionIndex + 1;
            
            // Progress
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Reset Timer
            resetTimer();

            // Tutor Logic
            const btnTutor = document.getElementById('btn-tutor');
            if (btnTutor) {
                btnTutor.onclick = () => {
                    tutorRequested = true;
                    if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('click');
                    textElement.innerHTML = OnyxCore.Tutor.simplifyText(q.text);
                    textElement.style.fontSize = '1.3rem';
                    textElement.style.lineHeight = '1.6';
                    btnTutor.style.opacity = '0.5';
                    btnTutor.innerText = 'SIMPLIFICADO ✓';
                    
                    // Aumenta o tempo em 15s para ler com calma
                    timeLeft += 15;
                    updateTimerUI();
                };
                btnTutor.style.opacity = '1';
                btnTutor.innerText = '✨ TUTOR';
            }

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-index">${String.fromCharCode(65 + i)}</span> ${opt}`;
                btn.onclick = () => handleAnswer(i, btn);
                container.appendChild(btn);
            });
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 20;
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    handleAnswer(-1); // Timeout
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('timer-text').textContent = `${timeLeft}s`;
            const offset = 283 - (timeLeft / 20) * 283;
            document.getElementById('timer-path').style.strokeDashoffset = offset;
        }

        function handleAnswer(idx, clickedBtn = null) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timerInterval);

            const q = questions[currentQuestionIndex];
            const isCorrect = idx === q.correct;
            
            const difficultyMultiplier = { easy: 10, medium: 20, hard: 40, insane: 80, impossible: 150 };
            const baseXP = difficultyMultiplier[difficulty] || 10;

            if (isCorrect) {
                score++;
                streak++;
                
                // Speed Bonus
                const speedBonus = (timeLeft / 20); // up to +1.0
                comboMultiplier = Math.min(3.0, 1.0 + (streak * 0.1) + speedBonus).toFixed(1);
                
                const earnedXP = Math.floor(baseXP * parseFloat(comboMultiplier));
                totalXPGained += earnedXP;
                
                if (clickedBtn) clickedBtn.classList.add('correct');
                if (typeof OnyxUI !== 'undefined') {
                    OnyxUI.playFeedback('success');
                    OnyxUI.showXPGain(earnedXP);
                }
                
                // Normal timeout for correct answer
                setTimeout(nextStep, 1000);
            } else {
                streak = 0;
                comboMultiplier = 1.0;
                lives--;
                updateLivesUI();
                
                if (clickedBtn) clickedBtn.classList.add('wrong');
                // Show correct one
                const btns = document.querySelectorAll('.option-btn');
                if (btns[q.correct]) btns[q.correct].classList.add('correct-hint');
                if (typeof OnyxUI !== 'undefined') OnyxUI.playFeedback('error');

                if (tutorRequested) {
                    // Tutor Feedback
                    const container = document.getElementById('options-container');
                    const feedbackDiv = document.createElement('div');
                    feedbackDiv.className = 'glass u-mt-20 u-p-15';
                    feedbackDiv.style.borderLeft = '4px solid var(--error)';
                    feedbackDiv.innerHTML = `
                        <p class="u-font-08 u-text-error u-mb-5 u-weight-900">EXPLICAÇÃO DO TUTOR:</p>
                        <p class="u-font-09">A resposta correta era <strong>"${q.options[q.correct]}"</strong>.</p>
                        <p class="u-font-09 u-mt-10 u-opacity-08">${OnyxCore.Tutor.simplifyText("Aqui usamos " + q.options[q.correct] + " porque se aplica à " + q.text)}</p>
                        <p class="u-font-07 u-mt-10 u-text-accent">(Carregando próxima em 5s...)</p>
                    `;
                    container.appendChild(feedbackDiv);
                    setTimeout(nextStep, 5000);
                } else {
                    setTimeout(nextStep, 2500); // Standard wait for wrong answer
                }
            }

            document.getElementById('streak-count').textContent = streak;
            document.getElementById('combo-multiplier').textContent = `${comboMultiplier}x`;
            if (streak >= 3) document.getElementById('streak-badge').classList.add('active');
            else document.getElementById('streak-badge').classList.remove('active');

            function nextStep() {
                currentQuestionIndex++;
                if (lives <= 0) {
                    finishMission(true); // Failed
                } else if (currentQuestionIndex < questions.length) {
                    renderQuestion();
                } else {
                    finishMission(false);
                }
            }
        }

        function updateLivesUI() {
            const lc = document.getElementById('lives-container');
            lc.innerHTML = '';
            for(let i=0; i<3; i++) {
                lc.innerHTML += `<span class="life-icon" style="${i >= lives ? 'opacity:0.2; filter:grayscale(1);' : ''}">❤️</span>`;
            }
        }

        async function finishMission(failed = false) {
            sessionStorage.setItem('onyx_final_score', score);
            
            try {
                let stats = await OnyxCore.DB.getUser(userName);
                if (!stats) stats = { id: userName, level: 1, xp: 0 };
                
                if (failed) {
                    totalXPGained = 0; // No XP gained on critical failure
                    if (stats.level > 1) {
                        stats.level--;
                    }
                    stats.xp = 0; // Reset current level XP to 0 as penalty
                } else {
                    stats.xp = (stats.xp || 0) + totalXPGained;
                    
                    let nextXP = (stats.level || 1) * 100;
                    while (stats.xp >= nextXP) {
                        stats.level++;
                        stats.xp -= nextXP;
                        nextXP = stats.level * 100;
                    }
                }
                
                // Update Bounties
                if (!failed && stats.bounties) {
                    const q = stats.bounties.quests.find(x => x.type === 'play_subject' && x.target === subject && !x.done);
                    if (q) {
                        q.current++;
                        if (q.current >= q.amount) {
                            q.done = true;
                            stats.xp += q.reward;
                        }
                    }
                }

                await OnyxCore.DB.saveUser(stats);
                await OnyxCore.DB.saveHistory({ user: userName, subject, difficulty, score, xpGained: totalXPGained, failed });
                console.log(`[QUIZ] Missão concluída: +${totalXPGained} XP`);
            } catch (err) {
                console.error("[QUIZ] Erro ao salvar progresso:", err);
            }
            
            location.href = 'results.html';
        }

        // Anti-Cheat Engine (Inspect Detection)
        async function triggerCheatPenalty(reason) {
            try {
                let stats = await OnyxCore.DB.getUser(userName);
                if (stats) {
                    if (stats.level > 1) {
                        stats.level--;
                    }
                    stats.xp = 0; // Reset current level XP to 0 as penalty
                    await OnyxCore.DB.saveUser(stats);
                    alert(`⚠️ [PROTOCOL ONYX - SEGURANÇA] Tentativa de ver o código detectada (${reason})! Você violou as diretrizes. Penalidade aplicada: -1 Nível. Retornando ao Dashboard.`);
                }
            } catch (err) {
                console.error("[ANTI-CHEAT] Erro ao aplicar penalidade:", err);
            }
            location.href = 'dashboard.html';
        }

        // 1. Context Menu (Right Click)
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            triggerCheatPenalty('Clique Direito / Inspecionar');
        });

        // 2. Keyboard Shortcuts (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
        document.addEventListener('keydown', (e) => {
            const isF12 = e.key === 'F12' || e.keyCode === 123;
            const isInspectCombos = e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c');
            const isViewSource = e.ctrlKey && (e.key === 'U' || e.key === 'u');
            
            if (isF12 || isInspectCombos || isViewSource) {
                e.preventDefault();
                triggerCheatPenalty('Atalhos de Desenvolvedor');
            }
        });

        window.onload = async () => {
            await OnyxCore.DB.init();
            startMission();
        };
    </script>
</body>
</html>
